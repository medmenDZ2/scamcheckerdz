<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SCAMCHECK</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <span class="wordmark">scamcheck</span>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <div id="configBanner" class="banner hidden">
    No backend connected yet.
    <a href="#" id="configBannerLink">Add your API URL</a>
  </div>

  <main>
    <section class="card" id="siteSection">
      <div class="site-row">
        <span class="site-domain" id="siteDomain">—</span>
        <span class="status-chip" id="siteStatusChip" data-level="unknown">Not checked</span>
      </div>
      <p class="summary" id="siteSummary"></p>

      <div class="details hidden" id="siteDetails"></div>

      <div class="actions">
        <button id="checkSiteBtn" class="btn btn-primary">Check this page</button>
        <button id="fullCheckBtn" class="btn btn-ghost hidden">Full check</button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Check a QR code <span class="optional">(paid feature)</span></h2>
      <div class="actions" style="margin-top: 0;">
        <button id="qrUploadBtn" class="btn btn-ghost">Upload QR image</button>
        <button id="qrCameraBtn" class="btn btn-ghost">Scan with camera</button>
      </div>
      <input type="file" id="qrFileInput" accept="image/*" class="hidden" />
      <div class="details hidden" id="qrDetails"></div>
      <div class="details hidden" id="qrPaywall"></div>
    </section>

    <section class="card">
      <h2 class="card-title">Check a message or link</h2>
      <textarea id="manualInput" placeholder="Paste a suspicious text, email, or URL here…" rows="3"></textarea>
      <div class="actions">
        <button id="manualCheckBtn" class="btn btn-primary">Check now</button>
      </div>
      <div class="details hidden" id="manualDetails"></div>
    </section>
  </main>

  <footer>
    No system can guarantee something is safe. For anything involving money, passwords, or ID documents, contact the organization directly through a source you already trust.
  </footer>

  <script src="lib/api.js"></script>
  <script src="lib/billing.js"></script>
  <script src="popup.js"></script>
</body>
</html>
